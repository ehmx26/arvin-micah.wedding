<!-- JavaScript & Shared Cloud Storage Logic -->
    <script>
        let photos = [];
        let currentFilter = 'all';
        let slideshowInterval = null;

        // Using a reliable public JSON bin endpoint
        const BIN_URL = "https://api.jsonbin.io/v3/b/6733fcd9acd3cb34a8a514d0";
        const BIN_HEADERS = {
            'Content-Type': 'application/json',
            'X-Master-Key': '$2a$10$7R9r2j8vYx8K1h5qL2x3hOPq8K6vKz5Y5hK8K6vKz5Y5hK8K6vKz5'
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const currentUrl = window.location.href;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl,
                width: 180,
                height: 180,
                colorDark: "#0a0a0a",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            await fetchPhotosFromCloud();
            setInterval(fetchPhotosFromCloud, 8000);
        });

        async function fetchPhotosFromCloud() {
            try {
                const response = await fetch(`${BIN_URL}/latest`, { headers: BIN_HEADERS });
                if (response.ok) {
                    const data = await response.json();
                    if (data.record && data.record.photos) {
                        photos = data.record.photos;
                        renderPhotos();
                        updateStats();
                        document.getElementById('sync-status').textContent = "Cloud Sync Active";
                    }
                } else {
                    throw new Error("Cloud fetch failed");
                }
            } catch (e) {
                // Fallback to localStorage if cloud fetch is restricted by browser CORS
                document.getElementById('sync-status').textContent = "Local Backup Active";
                const local = localStorage.getItem('arvin_micah_wedding_backup');
                if (local) {
                    photos = JSON.parse(local);
                    renderPhotos();
                    updateStats();
                }
            }
        }

        async function savePhotosToCloud() {
            // Always save to local backup first so it never gets lost on your device
            localStorage.setItem('arvin_micah_wedding_backup', JSON.stringify(photos));
            try {
                const response = await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: BIN_HEADERS,
                    body: JSON.stringify({ photos: photos })
                });
                if (!response.ok) {
                    console.warn("Cloud save restricted, saved locally.");
                }
            } catch (e) {
                console.error("Cloud sync network error:", e);
            }
        }

        function openUploadModal() {
            document.getElementById('upload-modal').classList.remove('hidden');
        }

        function closeUploadModal() {
            document.getElementById('upload-modal').classList.add('hidden');
            document.getElementById('upload-form').reset();
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('drop-prompt').classList.remove('hidden');
            document.getElementById('preview-container').innerHTML = '';
        }

        function openTableSignModal() {
            document.getElementById('table-sign-modal').classList.remove('hidden');
        }

        function closeTableSignModal() {
            document.getElementById('table-sign-modal').classList.add('hidden');
        }

        function previewFiles(input) {
            const previewContainer = document.getElementById('preview-container');
            const dropPrompt = document.getElementById('drop-prompt');
            previewContainer.innerHTML = '';
            if (input.files && input.files.length > 0) {
                dropPrompt.classList.add('hidden');
                previewContainer.classList.remove('hidden');
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = "w-full h-20 object-cover rounded-xl border shadow-sm";
                        previewContainer.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                });
            }
        }

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function handleUpload(event) {
            event.preventDefault();
            const fileInput = document.getElementById('file-input');
            const uploaderName = document.getElementById('uploader-name').value;
            const category = document.getElementById('upload-category').value;
            const caption = document.getElementById('upload-caption').value;
            const submitBtn = document.getElementById('submit-btn');

            if (!fileInput.files || fileInput.files.length === 0) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-2"></i>Uploading...';

            try {
                for (let i = 0; i < fileInput.files.length; i++) {
                    const compressedDataUrl = await compressImage(fileInput.files[i]);
                    const newPhoto = {
                        id: 'photo_' + Date.now() + Math.random().toString(36.substr(2, 9)),
                        url: compressedDataUrl,
                        uploader: uploaderName,
                        category: category,
                        caption: caption || 'Celebrating Arvin & Micah!',
                        likes: 0,
                        timestamp: 'Just now'
                    };
                    photos.unshift(newPhoto);
                }

                await savePhotosToCloud();
                closeUploadModal();
                renderPhotos();
                updateStats();
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload & Share Now';
                
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            } catch (error) {
                console.error("Upload error:", error);
                alert("Upload failed. Please try a smaller image.");
                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload & Share Now';
            }
        }

        function renderPhotos() {
            const grid = document.getElementById('photo-grid');
            const emptyState = document.getElementById('empty-state');
            
            const filteredPhotos = currentFilter === 'all' 
                ? photos 
                : photos.filter(p => p.category === currentFilter);

            if (photos.length === 0) {
                emptyState.classList.remove('hidden');
                grid.innerHTML = '';
                grid.appendChild(emptyState);
                return;
            }

            if (filteredPhotos.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-gray-400 font-serif text-xl">No photos found in this category yet.</div>`;
                return;
            }

            grid.innerHTML = '';
            filteredPhotos.forEach(photo => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 flex flex-col group";
                card.innerHTML = `
                    <div class="relative overflow-hidden aspect-square bg-gray-100">
                        <img src="${photo.url}" alt="Wedding Photo" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                        <span class="absolute top-3 right-3 bg-black/60 backdrop-blur-md text-white text-[10px] uppercase tracking-widest px-3 py-1 rounded-full">${photo.category}</span>
                        <a href="${photo.url}" target="_blank" download="Arvin-Micah-Wedding-${photo.id}.jpg" class="absolute bottom-3 right-3 bg-white/90 hover:bg-white text-noir w-9 h-9 rounded-full flex items-center justify-center shadow-md transition transform hover:scale-110" title="Download Photo">
                            <i class="fa-solid fa-download text-xs"></i>
                        </a>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between">
                        <div>
                            <p class="text-[11px] uppercase tracking-wider text-gray-400 mb-1">By <span class="font-semibold text-gray-800">${photo.uploader}</span></p>
                            <p class="text-sm font-medium text-noir mb-4">${photo.caption}</p>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100 text-xs text-gray-400">
                            <span>${photo.timestamp}</span>
                            <button onclick="likePhoto('${photo.id}')" class="flex items-center space-x-1.5 text-red-500 hover:scale-125 transition transform">
                                <i class="fa-solid fa-heart"></i>
                                <span class="font-semibold text-gray-700">${photo.likes || 0}</span>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-5 py-2.5 rounded-full text-xs uppercase tracking-widest font-medium bg-platinum text-charcoal hover:bg-platinum/80 transition";
            });
            document.getElementById(`filter-${category}`).className = "filter-btn px-5 py-2.5 rounded-full text-xs uppercase tracking-widest font-semibold bg-noir text-white transition shadow-sm";
            renderPhotos();
        }

        async function likePhoto(id) {
            const photo = photos.find(p => p.id == id);
            if (photo) {
                photo.likes = (photo.likes || 0) + 1;
                renderPhotos();
                updateStats();
                await savePhotosToCloud();
            }
        }

        function updateStats() {
            document.getElementById('stat-photos').textContent = photos.length;
            const uniqueUploaders = new Set(photos.map(p => p.uploader)).size;
            document.getElementById('stat-guests').textContent = uniqueUploaders;
            const totalLikes = photos.reduce((acc, p) => acc + (p.likes || 0), 0);
            document.getElementById('stat-likes').textContent = totalLikes;
        }

        async function downloadAllPhotos() {
            if (photos.length === 0) {
                alert("There are no photos in the album to download yet!");
                return;
            }
            const zip = new JSZip();
            const folder = zip.folder("Arvin_Micah_Wedding_Photos");
            
            photos.forEach((photo, index) => {
                const base64Data = photo.url.split(',')[1];
                if (base64Data) {
                    folder.file(`wedding-photo-${index + 1}-${photo.uploader.replace(/[^a-zA-Z0-9]/g, '_')}.jpg`, base64Data, {base64: true});
                }
            });

            zip.generateAsync({type:"blob"}).then(function(content) {
                saveAs(content, "Arvin-and-Micah-Wedding-Album.zip");
            });
        }

        function openSlideshow() {
            if (photos.length === 0) {
                alert("Please upload at least one photo before launching the slideshow!");
                return;
            }
            document.getElementById('slideshow-modal').classList.remove('hidden');
            let index = 0;
            const container = document.getElementById('slideshow-content');
            
            function showNext() {
                const photo = photos[index % photos.length];
                container.innerHTML = `
                    <div class="max-w-3xl mx-auto flex flex-col items-center animate-fade-in">
                        <img src="${photo.url}" class="max-h-[65vh] rounded-3xl shadow-2xl object-contain mb-6 border border-white/10">
                        <h4 class="font-serif text-3xl text-white font-medium">${photo.caption}</h4>
                        <p class="text-xs uppercase tracking-[0.2em] text-gray-400 mt-2">Photo by ${photo.uploader}</p>
                    </div>
                `;
                index++;
            }
            showNext();
            slideshowInterval = setInterval(showNext, 4000);
        }

        function closeSlideshow() {
            document.getElementById('slideshow-modal').classList.add('hidden');
            if (slideshowInterval) clearInterval(slideshowInterval);
        }
    </script>
